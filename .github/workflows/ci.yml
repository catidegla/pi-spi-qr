name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          # Laravel 13 requires PHP 8.3, which is its own floor and not this
          # package's. Somebody on 8.2 resolves to 12, so this pairing cannot
          # exist to be tested.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v5

      # The package itself needs no extension beyond the core. These are for
      # the Laravel bridge's test harness: Flysystem, which Laravel pulls in,
      # requires fileinfo, and the Windows images do not enable it by default.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, openssl
          coverage: none

      # Pinned rather than left to resolve, so each row tests the Laravel its
      # name claims. Without the pin every row above PHP 8.2 would quietly pick
      # the newest testbench and the Laravel 12 column would test 13.
      - name: Install
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      # The suite includes BCEAO's own published worked example. If that fails,
      # this package is wrong about the specification, not the other way round.
      - name: Test
        run: vendor/bin/phpunit
